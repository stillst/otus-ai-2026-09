<header class="topbar">
  <h1 class="wordmark">
    <span class="brace" aria-hidden="true">&#123; &#125;</span>
    <span class="visually-hidden">JSON </span>viewer
  </h1>
  <app-toolbar (fileSelected)="loadFile($event)" />
</header>

<main class="panes">
  <section class="pane" aria-labelledby="source-title">
    <h2 id="source-title" class="pane-title">Source</h2>
    <app-source-editor (fileDropped)="loadFile($event)" />
  </section>
  <section class="pane" aria-labelledby="tree-title">
    <h2 id="tree-title" class="pane-title">Tree</h2>
    <app-json-viewer />
  </section>
</main>

<app-toast />
